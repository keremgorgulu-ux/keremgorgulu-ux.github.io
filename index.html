  <style>
    body{margin:0;background:#0a0a0a;color:#e8e4df;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .load{opacity:.55;letter-spacing:.12em;text-transform:uppercase;font-size:12px}
  </style>
  <script>
  (function () {
    function rename(html) {
      // Preferred public name on website
      html = html.replace(/KEREM GORGULU/g, 'MARK KEREM GORGULU');
      html = html.replace(/Kerem Gorgulu/g, 'Mark Kerem Gorgulu');
      html = html.replace(/Meet Kerem/g, 'Meet Mark Kerem');
      html = html.replace(/Work With Kerem/g, 'Work With Mark Kerem');
      html = html.replace(/Worked with Kerem\?/g, 'Worked with Mark Kerem?');
      html = html.replace(/Kerem helps buyers/g, 'Mark Kerem helps buyers');
      html = html.replace(/Kerem has a 5\.0-star/g, 'Mark Kerem has a 5.0-star');
      html = html.replace(/Kerem will call/g, 'Mark Kerem will call');
      html = html.replace(/Yes\. Kerem provides/g, 'Yes. Mark Kerem provides');
      html = html.replace(/contact Kerem/g, 'contact Mark Kerem');
      html = html.replace(/Contact Kerem/g, 'Contact Mark Kerem');
      html = html.replace(/Text Kerem/g, 'Text Mark Kerem');
      html = html.replace(/About Kerem/g, 'About Mark Kerem');
      html = html.replace(/Join Kerem's list/g, "Join Mark Kerem's list");
      html = html.replace(/Kerem's list/g, "Mark Kerem's list");
      html = html.replace(/verified by Kerem/g, 'verified by Mark Kerem');
      html = html.replace(/KG Realty – Kerem Gorgulu/g, 'KG Realty – Mark Kerem Gorgulu');
      return html;
    }
    function card(item) {
      var meta = (item.meta || []).map(function (m) { return '<span>' + m + '</span>'; }).join('');
      var img = item.img || 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80';
      return '<article class="listing-card"><div class="listing-photo"><img src="' + img + '" alt="' + item.addr + ', ' + item.city + '" loading="lazy"><span class="listing-tag">' + item.tag + '</span></div><div class="listing-body"><div class="listing-price">' + item.price + '</div><div class="listing-addr">' + item.addr + '<br>' + item.city + '</div><div class="listing-meta">' + meta + '</div><a href="' + item.href + '" target="_blank" rel="noopener noreferrer" class="btn btn-outline" style="padding:11px 16px;font-size:11px">View listing</a></div></article>';
    }
    function applyListings(html, data) {
      if (!data || !data.items || !data.items.length) return html;
      var grid = data.items.map(card).join('');
      var head = '<div class="section-head"><h2>Active Listings</h2><p>' + data.sale + ' home' + (data.sale === 1 ? '' : 's') + ' for sale · ' + data.rent + ' home' + (data.rent === 1 ? '' : 's') + ' for rent — current inventory verified by Mark Kerem Gorgulu.</p></div><div class="listing-grid">' + grid + '</div>';
      html = html.replace(/<div class="section-head"><h2>Active Listings<\/h2>[\s\S]*?<div class="listing-grid">[\s\S]*?<\/div>\s*<div class="listings-foot">/, head + '<div class="listings-foot">');
      html = html.replace(/\d+ homes? for sale · \d+ homes? for rent — current inventory verified by (Mark Kerem|Kerem) Gorgulu\./g, data.sale + ' home' + (data.sale===1?'':'s') + ' for sale · ' + data.rent + ' home' + (data.rent===1?'':'s') + ' for rent — current inventory verified by Mark Kerem Gorgulu.');
      return html;
    }
    Promise.all([
      fetch('index.html.restored?v=listings4', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('restore'); return r.text(); }),
      fetch('listings-data.json?v=listings4', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
    ]).then(function (results) {
      var html = rename(results[0]);
      // Ensure social preview meta is present even if restored file is cached
      if (html.indexOf('og:image') === -1) {
        html = html.replace('</head>',
          '<meta property="og:image" content="https://photos.zillowstatic.com/fp/7a347cbd962c5025f1a35ed458f7e453-cc_ft_960.jpg">\n' +
          '<meta name="twitter:card" content="summary_large_image">\n' +
          '<meta name="twitter:image" content="https://photos.zillowstatic.com/fp/7a347cbd962c5025f1a35ed458f7e453-cc_ft_960.jpg">\n</head>');
      }
      // Prefer property photo over agent headshot in schema.org
      html = html.replace(
        '"image": "https://kgrealty.it.com/kerem-profile.jpg"',
        '"image": "https://photos.zillowstatic.com/fp/7a347cbd962c5025f1a35ed458f7e453-cc_ft_960.jpg"'
      );
      html = html.replace(/KG Realty – Kerem Gorgulu/g, 'KG Realty – Mark Kerem Gorgulu');
      html = html.replace(/KG Realty – Mark Kerem Gorgulu/g, 'KG Realty – Mark Kerem Gorgulu');
      html = applyListings(html, results[1]);
      document.open();
      document.write(html);
      document.close();
    }).catch(function () {
      document.body.innerHTML = '<div style="text-align:center;padding:40px"><h1 style="font-weight:300;letter-spacing:.06em;font-size:48px">MARK KEREM GORGULU</h1><p>KG Realty · REB365</p><p><a style="color:#c9a96e" href="tel:+14693388141">(469) 338-8141</a></p></div>';
    });
  })();
  </script>
</head>
