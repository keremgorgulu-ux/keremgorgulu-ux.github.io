name: KG Realty HAR Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install requests
      - name: Sync verified HAR data
        run: python scripts/sync_har.py
      - name: Commit only if changed
        run: |
          if git diff --quiet; then
            echo "No website changes needed."
            exit 0
          fi
          git config user.name "KG Realty Sync"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Sync KG Realty site with HAR"
          git push
