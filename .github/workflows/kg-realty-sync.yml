name: KG Realty Listing Sync

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_har.py'
      - 'scripts/fix_listing_photo_urls.py'
      - '.github/workflows/kg-realty-sync.yml'
  schedule:
    - cron: '0 14 * * 1'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync verified active listings
        run: python scripts/sync_har.py
      - name: Enforce reliable local listing photos
        run: python scripts/fix_listing_photo_urls.py
      - name: Commit only if changed
        run: |
          if git diff --quiet; then
            echo "No website changes needed."
            exit 0
          fi
          git config user.name "KG Realty Sync"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Sync KG Realty active listings"
          git push
